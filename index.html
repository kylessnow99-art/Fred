<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wallet BSC Diagnostic</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 16px; margin: 0; }
        .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 16px; border-radius: 8px; font-size: 16px; width: 100%; margin-top: 8px; font-weight: bold; }
        pre { background: #090d16; padding: 10px; border-radius: 6px; font-size: 11px; overflow-x: auto; color: #38bdf8; max-height: 150px; }
    </style>
</head>
<body>
    <h2>BSC Connection Test</h2>
    
    <div class="card">
        <h3>Status</h3>
        <p id="status">Initializing...</p>
        <button onclick="runTest()">Connect & Switch to BSC (0x38)</button>
    </div>

    <div class="card">
        <h3>Live Console Logs</h3>
        <pre id="logs">Waiting for action...</pre>
    </div>

    <script>
        function log(msg) {
            const pre = document.getElementById('logs');
            pre.innerText += "\n[" + new Date().toLocaleTimeString() + "] " + msg;
            pre.scrollTop = pre.scrollHeight;
            console.log(msg);
        }

        window.onerror = function(msg, url, line) {
            log("UI ERROR: " + msg + " (Line " + line + ")");
        };

        window.addEventListener('DOMContentLoaded', () => {
            log("DOM fully loaded.");
            const p = window.trustwallet || window.ethereum;
            if (p) {
                log("Provider detected: " + (window.trustwallet ? "window.trustwallet" : "window.ethereum"));
            } else {
                log("WARNING: No window.trustwallet or window.ethereum found immediately.");
            }
        });

        async function runTest() {
            try {
                log("Button tapped. Resolving provider...");
                const provider = window.trustwallet || window.ethereum || (window.ethereum?.providers?.find(p => p.isTrust));
                
                if (!provider) {
                    throw new Error("No EVM provider injected by Trust Wallet.");
                }

                log("Requesting accounts (eth_requestAccounts)...");
                const accounts = await provider.request({ method: 'eth_requestAccounts' });
                log("Connected account: " + accounts[0]);

                log("Attempting to switch to BNB Smart Chain (0x38)...");
                try {
                    await provider.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: '0x38' }]
                    });
                    log("SUCCESS: Switched to BNB Smart Chain!");
                } catch (switchErr) {
                    log("Switch error code: " + switchErr.code);
                    if (switchErr.code === 4902 || switchErr.code === -32603) {
                        log("Chain 0x38 missing. Adding network via wallet_addEthereumChain...");
                        await provider.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: '0x38',
                                chainName: 'BNB Smart Chain',
                                nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 },
                                rpcUrls: ['https://bsc-dataseed.bnbchain.org'],
                                blockExplorerUrls: ['https://bscscan.com']
                            }]
                        });
                        log("SUCCESS: BNB Smart Chain added and switched!");
                    } else {
                        throw switchErr;
                    }
                }
            } catch (err) {
                log("ERROR: " + (err.message || JSON.stringify(err)));
            }
        }
    </script>
</body>
      </html>
